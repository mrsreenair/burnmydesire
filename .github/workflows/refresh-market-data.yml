name: Refresh market data

# Keeps the bundled assets/data/market_returns.json current so every build
# ships fresh history, independent of whether the app's own runtime refresh
# can reach Yahoo from a given phone or network.
#
# Weekly on purpose. The app displays multi-decade average returns over
# monthly closes; a day changes them by roughly a thousandth of a percent.
# Fetching daily would just add load to a free, undocumented endpoint that
# has broken and reshaped itself before.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour — scheduled jobs on the hour queue
    # behind everyone else's.
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch from Yahoo
        working-directory: app
        run: python3 tool/fetch_market_data.py

      # The real failure mode of a free endpoint isn't an error, it's a
      # subtly wrong shape that parses fine and silently drops history.
      # Compare against what's already committed and refuse to regress.
      - name: Check the new data isn't worse than the old
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          path = 'app/assets/data/market_returns.json'
          new = json.load(open(path))
          old = json.loads(subprocess.run(
              ['git', 'show', f'HEAD:{path}'],
              capture_output=True, text=True, check=True).stdout)

          old_months = {f['id']: len(f['monthly']) for f in old['funds']}
          problems = []

          if len(new['funds']) != len(old['funds']):
              problems.append(
                  f"fund count changed: {len(old['funds'])} -> {len(new['funds'])}")

          for fund in new['funds']:
              before = old_months.get(fund['id'])
              if before is None:
                  problems.append(f"{fund['id']}: not in the previous file")
                  continue
              now = len(fund['monthly'])
              # One month of slack: the trailing partial month can drop out
              # depending on when in the month this runs.
              if now < before - 1:
                  problems.append(
                      f"{fund['id']}: history shrank {before} -> {now} months")
              if any(v <= 0 for v in fund['monthly']):
                  problems.append(f"{fund['id']}: non-positive price in series")

          if problems:
              print('\n'.join(problems), file=sys.stderr)
              sys.exit(1)

          print(f"ok — {len(new['funds'])} funds, generated {new['generated']}")
          PY

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- app/assets/data/market_returns.json; then
            echo "Market data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/data/market_returns.json
          git commit -m 'Refresh bundled market data'
          git push

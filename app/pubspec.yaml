name: burn_my_desire
description: "Burn My Desire — break the impulse, keep the wealth."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^11.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  purchases_flutter: ^10.8.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.1
  url_launcher: ^6.3.2

# Swap the bundled SQLite for SQLCipher so the database is encrypted at rest
# (PROJECT.md §5: temptation data is health-grade private). SQLCipher — not
# sqlite3mc — because we rely on PRAGMA cipher_version and sqlcipher_export.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/market_returns.json
    - assets/audio/fire.wav
  shaders:
    - assets/shaders/burn.frag
    - assets/shaders/ash.frag
    - assets/shaders/cold.frag

flutter_launcher_icons:
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png

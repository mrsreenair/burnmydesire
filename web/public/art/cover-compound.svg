<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="A small weekly cost compounding into a large curve">
  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#DCEFE2"/>
    </linearGradient>
    <linearGradient id="cline" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#17A567"/>
      <stop offset="1" stop-color="#0D7A4B"/>
    </linearGradient>
    <linearGradient id="cfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17A567" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#17A567" stop-opacity="0"/>
    </linearGradient>
    <filter id="csoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#csky)"/>
  <circle cx="1090" cy="110" r="230" fill="#F9E4D8" opacity="0.7" filter="url(#csoft)"/>

  <!-- baseline grid -->
  <g stroke="#161513" stroke-opacity="0.07" stroke-width="2">
    <path d="M120 620h960M120 500h960M120 380h960M120 260h960"/>
  </g>

  <!-- the identical weekly contributions -->
  <g fill="#161513" opacity="0.13">
    <rect x="150" y="596" width="26" height="24" rx="6"/>
    <rect x="222" y="596" width="26" height="24" rx="6"/>
    <rect x="294" y="596" width="26" height="24" rx="6"/>
    <rect x="366" y="596" width="26" height="24" rx="6"/>
    <rect x="438" y="596" width="26" height="24" rx="6"/>
    <rect x="510" y="596" width="26" height="24" rx="6"/>
    <rect x="582" y="596" width="26" height="24" rx="6"/>
    <rect x="654" y="596" width="26" height="24" rx="6"/>
    <rect x="726" y="596" width="26" height="24" rx="6"/>
    <rect x="798" y="596" width="26" height="24" rx="6"/>
    <rect x="870" y="596" width="26" height="24" rx="6"/>
    <rect x="942" y="596" width="26" height="24" rx="6"/>
  </g>

  <!-- what they become -->
  <path d="M150 620 C 420 616, 660 560, 810 452 C 930 366, 1000 262, 1050 150 L1050 620 Z" fill="url(#cfill)"/>
  <path d="M150 620 C 420 616, 660 560, 810 452 C 930 366, 1000 262, 1050 150"
        fill="none" stroke="url(#cline)" stroke-width="10" stroke-linecap="round"/>

  <circle cx="1050" cy="150" r="15" fill="#0D7A4B"/>
  <circle cx="1050" cy="150" r="30" fill="#17A567" opacity="0.18"/>

  <!-- the receipt that started it -->
  <g transform="translate(258 232) rotate(-3)">
    <rect x="-96" y="-64" width="192" height="128" rx="20" fill="#fff"/>
    <rect x="-96" y="-64" width="192" height="128" rx="20" fill="none" stroke="#161513" stroke-opacity="0.08"/>
    <rect x="-64" y="-36" width="128" height="11" rx="5.5" fill="#161513" opacity="0.68"/>
    <rect x="-64" y="-12" width="86" height="9" rx="4.5" fill="#161513" opacity="0.22"/>
    <rect x="-64" y="18" width="110" height="9" rx="4.5" fill="#161513" opacity="0.22"/>
    <rect x="-64" y="38" width="62" height="9" rx="4.5" fill="#FF6B2C" opacity="0.85"/>
  </g>
</svg>
